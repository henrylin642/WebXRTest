<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebXR ARCore Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="ar-overlay-root">
    <div id="overlay">
      <button id="ar-button">Start AR</button>
    </div>
    <div id="loading-screen" style="display: none;">
      <div class="loading-content">
        <div class="spinner"></div>
        <p>正在載入場景，請保持裝置靜止...</p>
        <div class="progress-container">
          <div id="progress-fill"></div>
        </div>
        <p id="progress-text">0%</p>
      </div>
    </div>
    <div id="iframe-overlay" style="display: none;">
      <div class="iframe-header">
        <button id="close-iframe">Close</button>
      </div>
      <iframe id="web-iframe" src=""></iframe>
    </div>

    <!-- Settings Button -->
    <div id="settings-btn" title="Set Image Width">⚙️</div>

    <!-- SLAM Quality Indicator -->
    <div id="slam-status" class="slam-good">SLAM: Stable</div>

    <!-- Snapshot Shutter Button -->
    <div id="snapshot-btn"></div>

    <!-- Mini Gallery Strip -->
    <div id="gallery-strip">
      <!-- Thumbnails will be injected here -->
      <!-- <div class="thumb-item"><img src="..."></div> -->
    </div>

    <!-- Photo Preview Modal -->
    <div id="photo-preview-modal" style="display:none;">
      <div class="preview-content">
        <span id="close-preview">×</span>
        <img id="preview-img" src="" />
        <div class="preview-actions">
          <a id="cloud-link" href="#" target="_blank">View in Cloud Album ☁️</a>
        </div>
      </div>
    </div>

    <!-- 6DoF Pose Info -->
    <div id="pose-info">Wait for detect...</div>

    <!-- Instructions UI -->
    <div id="step-instructions-container" style="display: none;">
      <div id="step-card" class="step-card">
        <h3 id="step-title">步驟 1</h3>
        <p id="step-desc">請掃描圖片</p>
      </div>
    </div>

    <div id="debug-console"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>

</html>
